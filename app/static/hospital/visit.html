<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f5f7">
<title>Find a Patient</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=block" rel="stylesheet">
<link href="/static/hospital/hospital.css" rel="stylesheet">
</head>
<body>
<main class="visit">
  <header class="visit-head">
    <span class="logo"><span class="ms fill">local_hospital</span></span>
    <div><h1>Find a patient</h1><small id="bname">We will show you the way to the room.</small></div>
  </header>
  <form id="form" autocomplete="off">
    <label class="field"><span>Patient number or name</span><input id="patient" name="patient" required placeholder="e.g. 100231 or Miller" autocapitalize="words"></label>
    <label class="field"><span>Visit code</span><input id="code" name="code" required inputmode="numeric" placeholder="from the patient or the ward"></label>
    <button class="btn" type="submit" id="submit"><span class="ms">search</span>Find room</button>
    <div class="notice" id="notice" hidden></div>
  </form>
  <section class="room-card" id="result" hidden>
    <div class="top"><span class="ms fill">bed</span><div><b id="rRoom"></b><span class="muted" id="rName"></span></div></div>
    <dl>
      <div><dt>Ward</dt><dd id="rWard"></dd></div>
      <div><dt>Floor</dt><dd id="rFloor"></dd></div>
      <div><dt>Route</dt><dd id="rWalk"></dd></div>
    </dl>
    <div id="plan"></div>
    <div class="foot">
      <div class="anim-status" id="status"></div>
      <div class="hours"><span class="ms">schedule</span><span id="rHours"></span></div>
      <p class="say" id="rSay" hidden></p>
      <button class="btn ghost" type="button" id="replay"><span class="ms">replay</span>Show route again</button>
    </div>
  </section>
</main>
<script type="module" src="/static/hospital/visit.js"></script>
</body>
</html>
