<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#081018">
<title>Pager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..700,0..1,0&display=block" rel="stylesheet">
<link href="/static/hospital/pager.css" rel="stylesheet">
</head>
<body>
<div class="stage" id="stage">
  <main class="pg" id="pg" data-state="loading" aria-live="polite">
    <section class="hero" id="hero">
      <div class="hero-icon"><span class="ms" id="heroIcon">hourglass_empty</span></div>
      <div class="hero-txt">
        <div class="hero-big" id="heroBig">Loading…</div>
        <div class="hero-sub" id="heroSub"></div>
      </div>
      <button class="mic" id="mic" type="button" aria-label="Speak (Space)"><span class="ms">mic</span></button>
    </section>
    <section class="map">
      <div id="plan"></div>
      <div class="map-floor" id="floor" hidden></div>
      <div class="map-off" id="offline" hidden><span class="ms">wifi_off</span>Offline</div>
      <button class="map-reset" id="reset" type="button" aria-label="Back to start (R)"><span class="ms">restart_alt</span>Start</button>
      <div class="map-chips" id="chips"></div>
      <div class="map-voice" id="voice" hidden><span class="ms" id="voiceIcon">graphic_eq</span><span class="voice-txt" id="voiceTxt"></span></div>
    </section>
    <div class="cams" id="cams" aria-hidden="true"><i></i><i></i><b></b></div>
    <div class="dbg" id="debug" hidden></div>
  </main>
</div>
<script type="module" src="/static/hospital/pager.js"></script>
</body>
</html>
