<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#202124">
<title>Hospital Maps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=block" rel="stylesheet">
<link href="/static/hospital/maps.css" rel="stylesheet">
</head>
<body>
<main class="mx" id="app">
  <div id="plan"></div>

  <aside class="side" id="side">
    <form class="search" id="searchForm" role="search" autocomplete="off">
      <input id="q" type="search" placeholder="Search this building" aria-label="Search this building" spellcheck="false">
      <button type="submit" class="ibtn" aria-label="Search"><span class="ms">search</span></button>
      <button type="button" class="ibtn clear" id="clear" aria-label="Clear search" hidden><span class="ms">close</span></button>
      <button type="button" class="ibtn dir-open" id="dirOpen" aria-label="Directions" title="Directions"><span class="ms">directions</span></button>
      <button type="button" class="ibtn ask-open" id="askOpen" aria-label="Ask about this building" title="Ask about this building"><span class="ms">auto_awesome</span></button>
    </form>
    <div class="suggest" id="suggest" role="listbox" hidden></div>
    <div class="chips" id="chips"></div>
    <section class="results" id="results" hidden>
      <header class="results-head" id="resultsHead"></header>
      <div class="results-list" id="resultsList"></div>
    </section>
    <section class="dir" id="dir" hidden>
      <header class="dir-head">
        <button type="button" class="ibtn" id="dirClose" aria-label="Close directions"><span class="ms">arrow_back</span></button>
        <h1>Directions</h1>
      </header>
      <div class="dir-ends">
        <div class="dir-rail" aria-hidden="true"><span class="ms o">trip_origin</span><i></i><span class="ms d">location_on</span></div>
        <div class="dir-inputs">
          <input id="dFrom" type="search" placeholder="Choose starting point" aria-label="Starting point" autocomplete="off" spellcheck="false">
          <input id="dTo" type="search" placeholder="Choose destination" aria-label="Destination" autocomplete="off" spellcheck="false">
        </div>
        <button type="button" class="ibtn" id="dSwap" aria-label="Swap start and destination"><span class="ms">swap_vert</span></button>
      </div>
      <label class="dir-opt"><input type="checkbox" id="dStep"><span class="ms">accessible</span>Step-free (lifts only)</label>
      <div class="dir-sug" id="dSug" hidden></div>
      <div class="dir-out" id="dOut"></div>
    </section>
    <section class="ask" id="ask" hidden>
      <header class="dir-head">
        <button type="button" class="ibtn" id="askClose" aria-label="Close assistant"><span class="ms">arrow_back</span></button>
        <h1>Ask about this building</h1>
      </header>
      <div class="ask-log" id="askLog" aria-live="polite"></div>
      <form class="ask-bar" id="askForm" autocomplete="off">
        <input id="askIn" type="text" placeholder="Ask, or tell me what changed" aria-label="Ask about this building" spellcheck="false">
        <button type="button" class="ibtn" id="askMic" aria-label="Speak"><span class="ms">mic</span></button>
        <button type="submit" class="ibtn send" aria-label="Send"><span class="ms">send</span></button>
      </form>
    </section>
  </aside>

  <div class="corner" id="corner">
    <div class="bmenu">
      <button type="button" class="bchip" id="bchip" aria-haspopup="menu" aria-expanded="false">
        <span class="ms">domain</span><span class="bname" id="bname">Loading…</span><span class="ms caret">arrow_drop_down</span>
      </button>
      <div class="menu" id="bmenu" role="menu" hidden></div>
    </div>
    <button type="button" class="upload-btn" id="uploadOpen"><span class="ms">upload</span>Upload floor plan</button>
  </div>

  <article class="place" id="place" hidden></article>
</main>

<dialog class="dlg" id="upload" aria-labelledby="upTitle">
  <form method="dialog" class="dlg-body" id="uploadForm">
    <header class="dlg-head">
      <h2 id="upTitle">Upload floor plan</h2>
      <button class="ibtn" value="close" aria-label="Close"><span class="ms">close</span></button>
    </header>
    <div id="upStep">
      <p class="dlg-sub">One image per floor, ground floor first. Rooms, doors, stairs and lifts are found automatically.</p>
      <label class="drop" id="drop">
        <span class="ms">add_photo_alternate</span>
        <b>Drop floor plans here</b>
        <span>or <u>choose files</u> · PNG or JPG</span>
        <input id="upFiles" type="file" accept="image/*" multiple hidden>
      </label>
      <ol class="staged" id="staged"></ol>
      <label class="field"><span>Building name (optional)</span><input id="upName" type="text" placeholder="e.g. North Hospital"></label>
    </div>
    <div class="progress" id="upBusy" hidden>
      <div class="bar"><i></i></div>
      <p>Reading the plans: rooms, doors, stairs and lifts. This takes about 10–20 seconds.</p>
    </div>
    <div id="upScale" hidden></div>
    <p class="dlg-err" id="upErr" role="alert" hidden></p>
    <footer class="dlg-foot" id="upFoot">
      <button type="button" class="tbtn" value="close" id="upCancel">Cancel</button>
      <button type="button" class="pbtn" id="upRun" disabled>Import</button>
    </footer>
  </form>
</dialog>
<script type="module" src="/static/hospital/maps.js"></script>
</body>
</html>
