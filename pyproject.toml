[project]
name = "hack-more"
version = "0.1.0"
description = "Industrial Agents Hackathon 2026, Track 01: benchmark agent"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.1.0",
    "fastapi>=0.162.0",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "python-multipart>=0.0.32",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "benchmark", "app", "hospital"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
